spring:
  application:
    name: planb-market

  datasource:
    url: jdbc:h2:mem:planb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false
    # 이게 없으면 data.sql이 테이블 생성보다 먼저 돌아서 그냥 깨짐.
    # ddl-auto로 스키마를 만든 뒤에 시드를 넣으라고 순서를 미뤄주는 옵션
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      encoding: UTF-8

# 집계·통계 전용. JPA와의 역할 분리는 SPEC 4-7절 참고
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.skala.planbmarket.domain.entity
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    # path는 "여기로 들어오면 Swagger로 보내준다"는 진입 경로임. 최종 화면 주소인
    # /swagger-ui/index.html을 여기 적으면 리다이렉트가 한 번 더 돌아서 경로가 겹침
    # (/swagger-ui/swagger-ui/index.html). 기본값을 쓰면 두 주소 다 알아서 열림
    # 태그는 이름순 정렬 — 앞에 번호를 붙여둬서 회원 → 티켓 → 판매 순으로 나옴
    tags-sorter: alpha
    # operations-sorter는 일부러 안 걸었음. method로 정렬하면 메서드 알파벳순이라
    # DELETE(회원 삭제)가 태그 맨 위로 올라와서 첫인상이 이상해짐.
    # 안 걸면 같은 경로끼리 묶여서 나오는데 그게 훨씬 읽기 나음

management:
  endpoints:
    web:
      exposure:
        # 기본값은 health·info뿐이라 metrics·prometheus가 404가 남.
        # 운영이라면 골라서 열 자리지만 이 프로젝트는 시연·검증이 목적이라 넷을 연다
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 안 켜면 커스텀 HealthIndicator가 UP/DOWN 판정에는 반영되는데 응답에는 안 보임.
      # "무엇이 왜 DOWN인지"가 안 보이면 헬스체크가 절반만 하는 셈
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: PlanB Market
    description: 소멸성 자산(만료 기한이 있는 티켓)의 P2P 양도 플랫폼
    version: 1.0.0

logging:
  level:
    com.skala.planbmarket: DEBUG
